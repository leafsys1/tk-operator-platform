[project]
name = "op-agent-console"
version = "0.1.0"
description = "算子开发 Web 控制台（op-agent console）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",  # 对话附件上传  # 读硬件画像 ops/chips/*.yaml（极限/Roofline 对比用）
]

[dependency-groups]
# 控制台自身的回归（方案 §12 只覆盖算子任务；这里补「控制台本身」的那部分）
dev = [
    "pytest>=8.2",
    "httpx>=0.27",        # fastapi.testclient 需要
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
