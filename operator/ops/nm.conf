# Server acceptance deployment: fixed physical device 2.
# The host driver (26.0.rc1) refuses ACL init in unprivileged device-passthrough
# containers (dcmi -8020 "device is used"); nm.conf.example already documents that
# --privileged is required for npu-smi/torch_npu to see devices on this host.
# Docker 18.09 official default profile, supplied explicitly for current libseccomp.
OPX_ENTRYPOINT=${OPX_ENTRYPOINT:-bash}
OPX_DOCKER_ARGS=${OPX_DOCKER_ARGS:-"--privileged --security-opt seccomp=/data/lfx/op-agent-console-20261101/config/docker-18.09-default.json -e OPENBLAS_NUM_THREADS=1 --device=/dev/davinci_manager --device=/dev/devmm_svm --device=/dev/hisi_hdc -v /usr/local/dcmi:/usr/local/dcmi:ro -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro -v /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro -v /etc/ascend_install.info:/etc/ascend_install.info:ro"}
OPX_ENV_RECIPE=${OPX_ENV_RECIPE:-"for f in /usr/local/Ascend/ascend-toolkit/set_env.sh /usr/local/Ascend/*/share/info/ascendnpu-ir/bin/set_env.sh /usr/local/Ascend/nnal/atb/set_env.sh; do [ -f \"\$f\" ] && . \"\$f\" >/dev/null 2>&1 || true; done"}
